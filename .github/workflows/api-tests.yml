name: API Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      live:
        description: "Also run the suite against the live reqres.in API (uses the REQRES_API_KEY secret if set)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    name: Tests against the WireMock simulation (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['21', '25']
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          java-version: ${{ matrix.java }}
          distribution: temurin
          cache: maven

      - name: Run tests
        run: mvn -B test

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-jdk${{ matrix.java }}
          path: |
            target/surefire-reports/
            target/allure-results/
          retention-days: 30

  live:
    name: Tests against live reqres.in (manual)
    if: github.event_name == 'workflow_dispatch' && inputs.live
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
      - name: Run tests live
        env:
          REQRES_API_KEY: ${{ secrets.REQRES_API_KEY }}
        run: mvn -B test -Dbase.url=https://reqres.in -Dapi.key="$REQRES_API_KEY"
